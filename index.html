<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000">
<link rel="icon" href="data:,">
<title>lullabye</title>
<style>
html, body { margin: 0; height: 100%; background: #000; cursor: none; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
video { position: fixed; width: 1px; height: 1px; }
p, pre { position: fixed; margin: 0; color: #888; font: 16px/1.5 sans-serif; }
p { display: none; top: 50%; width: 100%; transform: translateY(-50%); text-align: center; }
pre { display: none; bottom: 16px; left: 16px; right: 16px; white-space: pre-wrap; }
.off p, .log pre { display: block; }
</style>
</head>
<body>
<video src="blank.mp4" muted loop playsinline></video>
<p>Click or tap anywhere to keep the screen awake.<br>This text disappears once it's working.</p>
<pre></pre>
<script>
const video = document.querySelector('video');
const native = 'wakeLock' in navigator;

function show(working) {
  document.body.classList.toggle('off', !working);
}

video.addEventListener('timeupdate', () => {
  if (video.currentTime > 0.5) video.currentTime = Math.random();
});

if (!native) {
  video.addEventListener('playing', () => show(true));
  video.addEventListener('pause', () => show(false));
}

let lock = null;

async function acquire() {
  if (document.visibilityState !== 'visible') return;
  video.play().catch(() => {
    if (!native) show(false);
  });
  if (lock || !native) return;
  try {
    lock = await navigator.wakeLock.request('screen');
    lock.addEventListener('release', () => {
      lock = null;
      acquire();
    });
    show(true);
  } catch {
    show(false);
  }
}

document.addEventListener('visibilitychange', acquire);
addEventListener('pointerdown', acquire);
addEventListener('keydown', acquire);
acquire();

const trail = document.querySelector('pre');
const stamp = time => new Date(time).toString().slice(4, 24);
const count = (n, word) => n > 0 && `${n} ${word}${n > 1 ? 's' : ''}`;
let log = [];
try { log = JSON.parse(localStorage.activity) || []; } catch {}

function describe(stretch) {
  const what = [
    stretch.opened && 'opened the page',
    stretch.mouse > 0 && 'moved the mouse',
    count(stretch.clicks, 'click'),
    count(stretch.keys, 'key'),
    stretch.scroll > 0 && 'scrolled',
  ].filter(Boolean).join(', ');
  return `${stamp(stretch.start)} – ${stamp(stretch.end).slice(-8)}  ${what}`;
}

function save() {
  try { localStorage.activity = JSON.stringify(log); } catch {}
  trail.textContent = log.slice(-10).map(describe).join('\n');
}

function begin(opened) {
  const now = Date.now();
  log = [...log, { start: now, end: now, opened, mouse: 0, clicks: 0, keys: 0, scroll: 0 }].slice(-100);
}

function record(kind) {
  if (Date.now() - log[log.length - 1].end > 30000) begin(false);
  const stretch = log[log.length - 1];
  const before = describe(stretch);
  stretch.end = Date.now();
  stretch[kind]++;
  if (describe(stretch) !== before) save();
}

begin(true);
save();

addEventListener('mousemove', () => record('mouse'));
addEventListener('pointerdown', () => record('clicks'));
addEventListener('keydown', () => record('keys'));
addEventListener('wheel', () => record('scroll'));

let press;

addEventListener('pointerdown', () => {
  clearTimeout(press);
  press = setTimeout(() => document.body.classList.toggle('log'), 1000);
});
addEventListener('pointerup', () => clearTimeout(press));
addEventListener('pointercancel', () => clearTimeout(press));
addEventListener('contextmenu', event => event.preventDefault());

addEventListener('dblclick', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
</script>
</body>
</html>
